version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: orchestrator_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: orchestrator_backend
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/cross_brand
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: orchestrator_frontend
    ports:
      - "4000:3000"
    depends_on:
      - backend

volumes:
  mongodb_data:
